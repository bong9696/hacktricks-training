name: Azure Login with Managed Identity

on:
  push:
    branches:
      - main

jobs:
  azure-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Azure CLI
        uses: azure/setup-azure-cli@v1

      - name: Login with Managed Identity
        uses: azure/login@v1
        with:
          client-id: <your-client-id>
          tenant-id: <your-tenant-id>

      - name: List Storage Blob
        run: |
          az storage blob list --account-name <your-storage-account> --container-name <your-container-name> --auth-mode login
